RUNTIME:
  DEVICE: cpu
  SEED: 0

HARDWARE_RESOURCES:
    Agilent_33250A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: Agilent Technologies,33250A,0,1.03-1.01-1.00-03-1
    Tektronix_TDS2000:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: TEKTRONIX,TBS2074,C020561,CF:91.1CT FV:v1.26.0; FPGA:v1.21;
    HP_EE3631A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: HEWLETT-PACKARD,E3631A,0,1.6-5.0-1.0

# OFDM settings 
DATA_COLLECTION:
  DC_OFFSETS: [0.052] # A (single offset)
  F_MINS: [300e3] # Hz
  F_MAXS: [7.6e6] # Hz
  OSC_SAMPLE_RATES: [500e6] # Hz
  SUBCARRIER_SPACING: 100e3 # Hz
  UPSAMPLE_FACTOR: 4
  AWG_TABLE_FRACTION: 0.5
  CP_LENGTH_FRACTION: 0.125
  PREAMBLE_LENGTH: 256
  CONSTELLATION: qpsk        # constellation used for mod/demod and the constellation plot
  OSC_SCALE: 0.5 # V/div
