RUNTIME:
  DEVICE: cpu
  SEED: 0
HARDWARE_RESOURCES:
    Agilent_33250A: 
        DRIVER_PATH: pyflux.hardware.drivers
        ID: Agilent Technologies,33250A,0,1.03-1.01-1.00-03-1
    Tektronix_TDS2000:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: TEKTRONIX,TBS2074,C020561,CF:91.1CT FV:v1.26.0; FPGA:v1.21;
    HP_EE3631A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: HEWLETT-PACKARD,E3631A,0,1.6-5.0-1.0
DATA_COLLECTION:
  N: 10 # Number of datapoints collected at each DC offset
  DC_OFFSETS: [0.122] # A
  F_MINS: [300e3] # Hz 
  F_MAXS: [12.99e6] # Hz
  OSC_SAMPLE_RATES: [62.5e6] # Hz
  SUBCARRIER_SPACING: 1e4 # Hz
  UPSAMPLE_FACTOR: 2
  AWG_TABLE_FRACTION: 0.5
  CP_LENGTH_FRACTION: 0.125
  PREAMBLE_LENGTH: 256
  MODULATION_FORMAT: "qpsk"
  OSC_SCALE: 0.2
  DATASET_PATH: "/home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/sweeps/dc0.122A_fmin300000_fmax1.299e+07_20260615_1430.zarr"

CHANNEL_GRID_SEARCH:
  RECEPTIVE_FIELD: 20
  VAL_FRACTION: 0.2
  # SELECTED_RUN_IDS:        # optional: pin exactly which channel runs advance to the
  #   - tcn_1a2b3c4d         # encoder/decoder stage. When set, overrides best-per-family
  #   - gmp_5e6f7a8b         # selection. Comment out to auto-select by validation loss.
  models:
    - model: gmp
      params:
        memory_linear: [4, 8]
        memory_nonlinear: 4
        nonlinearity_order: 5
        cross_term_depth: [0, 2]
        ridge: 1.0e-3

    - model: tcn
      params:
        nlayers: [2, 3]
        hidden_channels: [16, 32]
        num_taps: 10
        dilation_base: 2
        epochs: 200
        lr: 1.0e-3

ENCODER_DECODER:
  CONSTELLATION: qpsk
  PREAMBLE_AMPLITUDE: 3.0     # encoder output is clamped to
  params:
    nlayers: [2, 3]
    dilation_base: 2
    num_taps: 5
    hidden_channels: 8
    epochs: 100
    lr: 1.0e-3
    weight_decay: 1.0e-5    # AdamW L2 regularization; 0 disables. List -> swept.
    batch_size: 16