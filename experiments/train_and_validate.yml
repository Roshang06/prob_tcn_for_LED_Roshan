RUNTIME:
  DEVICE: cuda
  SEED: 0

# Set either path to reuse a previously trained experiment and skip that grid
# search step entirely. Leave unset (or null) to run a fresh grid search.
# CHANNEL_EXP_DIR: /home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/experiments/train_and_validate/channel_models_YYYYMMDD_HHMM
# ENCODER_DECODER_EXP_DIR: /home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/experiments/train_and_validate/encoder_decoder_YYYYMMDD_HHMM


# CHANNEL_EXP_DIR:
# ENCODER_DECODER_EXP_DIR:
HARDWARE_RESOURCES:
    Agilent_33250A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: Agilent Technologies,33250A,0,1.03-1.01-1.00-03-1
    Tektronix_TDS2000:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: TEKTRONIX,TBS2074,C020561,CF:91.1CT FV:v1.26.0; FPGA:v1.21;
    HP_EE3631A:
        DRIVER_PATH: pyflux.hardware.drivers
        ID: HEWLETT-PACKARD,E3631A,0,1.6-5.0-1.0
DATA_COLLECTION: 
  N: 5000 # Number of datapoints collected at the DC offset
  DC_OFFSETS: [0.050] # A (single offset per dataset)
  F_MINS: [300e3] # Hz
  F_MAXS: [7.6e6] # Hz
  OSC_SAMPLE_RATES: [500e6] # Hz
  SUBCARRIER_SPACING: 100e3 # Hz
  UPSAMPLE_FACTOR: 4
  AWG_TABLE_FRACTION: 0.125
  CP_LENGTH_FRACTION: 0.125
  PREAMBLE_LENGTH: 256
  MODULATION_FORMAT: "m7_apsk_constellation"
  OSC_SCALE: 0.5 # V/div
  POWER_MIN: 0.1  # minimum symbol power
  POWER_MAX: 1.5  # maximum symbol power
  JITTER_POWER: 0 # off-constellation complex noise on symbols (collection only); 0 disables
  DATASET_PATH: /home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/sweeps/tall_river_dc0.05A_fmin300000_fmax7.6e+06_20260713_1711.zarr
  CLIP_THRESHOLD: 3.0 # clip the AWG output to +/-this value (V)

CHANNEL_GRID_SEARCH:
  VAL_FRACTION: 0.1
  EXCLUDE_WARMUP: false
  SELECTION_MODE: all  # "best" or "best_per_size" or "all"
  PROB_SELECTION_KEY: val_per_burst_rrmse_pct  # for probabilistic models, the metric used to select the best run
                            
  # SELECTED_RUN_IDS:        # optional: pin exactly which channel runs advance to the
  #   - tcn_1a2b3c4d         # encoder/decoder stage.
  #   - gmp_5e6f7a8b        
  models:
    - model: gmp
      params:
        memory_linear: 105
        memory_nonlinear: 105
        nonlinearity_order: [3, 4]
        cross_term_depth: [8, 16]
        ridge: 1.0e-3

    - model: tcn   # size axis: width at fixed RF = 1 + 15*(1+2+4) = 106 samples,
      params:      # matching the channel's ~100-sample memory (no RF confound)
        nlayers: [3]
        hidden_channels: [4, 8, 16]
        kernel_size: [16]
        dilation_base: 2
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["none"]

    - model: tcn
      params:
        nlayers: [3]
        hidden_channels: [4, 8, 16]
        kernel_size: [16]
        dilation_base: 2
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["gaussian", "students_t"]
        beta_nll: [0.5, 1]

    - model: lru   # Linear Recurrent Unit
      params:
        state_dim: [8, 16]      # linear state-space size (memory capacity)
        hidden_dim: [8, 16]     # per-timestep feature width
        n_layers: 2
        dropout: 0.1
        r_min: 0.0               # eigenvalue-radius init range; r_max -> 1 allows long memory
        r_max: 1.0
        max_phase: 6.28          # init phase spread (2*pi) of the state eigenvalues
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5 # Learning rate scheduler
        patience: 25
        min_lr: 1.0e-6
        distribution: ["none"]

    - model: lru
      params:
        state_dim: [8, 16]
        hidden_dim: [8, 16]
        n_layers: 2
        dropout: 0.1
        r_min: 0.0
        r_max: 1.0
        max_phase: 6.28
        epochs: 200
        lr: 1.0e-3
        batch_size: 16
        factor: 0.5
        patience: 25
        min_lr: 1.0e-6
        distribution: ["gaussian", "students_t"]
        beta_nll: [0.5, 1]

ENCODER_DECODER:
  CONSTELLATION: qpsk
  PREAMBLE_AMPLITUDE: 3.0     # encoder output is clamped to +-this
  params:
    nlayers: [2]
    dilation_base: [2]
    kernel_size: [16]
    hidden_channels: [16]
    epochs: 1500
    noise_anneal_start: [0.5]   # fraction of epochs at full channel noise before a linear
                              # decay to 0 by the last epoch; 1.0 disables annealing.
                              # Only affects probabilistic channels; sweep e.g. [1.0, 0.5]
                              # to compare (note: also duplicates nonprob runs, where it is inert)
    lr: 1.0e-3
    weight_decay: [1e-5]  # AdamW L2 regularization; 0 disables.
    batch_size: 64
    factor: 0.5 # Learning rate scheduler
    patience: 25
    min_lr: 1.0e-6

ENCODER_DECODER_VALIDATION:
  CONSTELLATION: qpsk
  NOISE_FLOOR_POINTS: 20  # repeats of one fixed encoded symbol to estimate the additive
                           # noise floor per E/D; 0 disables the noise-floor plot
  # Standalone follow-up (experiments/higher_order_test.py), run after a finished
  # train_and_validate. Retrains the best E/D's architecture on higher-order
  # constellations using the channel model it was trained against, then validates on
  # live hardware to measure the spectral efficiency each modulation order sustains.
  HIGHER_ORDER_TEST:
    ENABLED: true
    CONSTELLATION: [m7_apsk_constellation, m6_apsk_constellation]   # one name or a list, e.g. [m6_apsk_constellation, m7_apsk_constellation]
    N: 50                                  # validation trials per constellation
    ED_RUN_ID: tcn_ae_08dff8e8_c3c6bca2    # pin an E/D run_id; null -> lowest validation EVM
    CHANNEL_EXP_DIR: /home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/experiments/train_and_validate/dawn_fold_channel_models_20260714_1613     # finished channel_models_ dir (channel model to retrain against)
    VALIDATION_EXP_DIR: /home/photonicslab/Desktop/microled_project/prob_tcn_for_LED/data/experiments/train_and_validate/dawn_fold_ed_validation_20260714_2326  # finished ed_validation_ dir (source of the best E/D arch + channel)